<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Explora el menú de Zona Astro: bebidas calientes, bebidas frías y alimentos."
  >
  <title>Menú | Zona Astro</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="CSS/menu.css">
  <link rel="stylesheet" href="CSS/header.css">
  <link rel="stylesheet" href="CSS/footer.css">
  <link rel="stylesheet" href="CSS/carrito_flotante.css">

  <script src="scripts/cart-storage.js" defer></script>
  <script src="scripts/components.js" defer></script>
  <script src="scripts/carrito_flotante.js" defer></script>
  <script src="scripts/menu.js" defer></script>
</head>

<body>
  <div id="header"></div>

  <main>
    <section class="hero" aria-labelledby="menu-title">
      <div class="hero__text">
        <h1 id="menu-title">Descubre nuestro<br>menú completo</h1>
      </div>
      <div class="hero__image">
        <img
          src="https://i.ibb.co/DXp7RbH/Gemini-Generated-Image-hgbqp2hgbqp2hgbq.jpg"
          alt="Ilustración de Zona Astro"
          width="320"
          height="300"
          fetchpriority="high"
        >
      </div>
    </section>

    <nav class="categories" id="categories-nav" aria-label="Filtrar productos por categoría">
      <button
        class="categories__item is-active"
        type="button"
        data-category="bebidas-calientes"
        aria-pressed="true"
      >
        <span class="categories__icon" aria-hidden="true">☕</span>
        <span class="categories__label">Bebidas calientes</span>
      </button>
      <button
        class="categories__item"
        type="button"
        data-category="bebidas-frias"
        aria-pressed="false"
      >
        <span class="categories__icon" aria-hidden="true">🥤</span>
        <span class="categories__label">Bebidas frías</span>
      </button>
      <button
        class="categories__item"
        type="button"
        data-category="alimentos"
        aria-pressed="false"
      >
        <span class="categories__icon" aria-hidden="true">🥐</span>
        <span class="categories__label">Alimentos</span>
      </button>
    </nav>

    <section
      class="products"
      id="products-grid"
      aria-label="Productos del menú"
      aria-live="polite"
      aria-busy="false"
    >
      <p class="products__loading">Cargando productos...</p>
    </section>
  </main>

  <a href="carrito.html" class="floating-cart" id="floating-cart" aria-label="Ver carrito">
    <span aria-hidden="true">🛒</span>
    <span class="floating-cart__badge" id="cart-count" hidden>0</span>
  </a>

  <div id="footer"></div>
</body>
</html>
